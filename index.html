<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Japan Trip">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<title>Japan Trip</title>
<style>
:root{--bg:#0f1220;--card:#181c2e;--card2:#222840;--text:#eef0f7;--muted:#9aa0b8;--accent:#ff4d6d;--accent2:#5fd4e6;--ok:#3ddc97;--warn:#ffb347;--line:#2a3048}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:700;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(15,18,32,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0;letter-spacing:-.2px}
h2{font-size:17px;margin:2px 0 10px}
h3{font-size:15px;margin:0 0 4px}
main{padding:12px 16px;max-width:720px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:14px;margin:0 0 12px}
.muted{color:var(--muted);font-size:14px}
.small{font-size:13px}
a{color:var(--accent2);text-decoration:none}
nav{position:fixed;left:0;right:0;bottom:0;z-index:800;display:flex;background:#12162a;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:8px 0 7px;font:600 11px/1 inherit;display:flex;flex-direction:column;align-items:center;gap:4px}
nav button .i{font-size:21px;line-height:1}
nav button.on{color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:500 15px/1.1 inherit;cursor:pointer}
.btn.sm{padding:6px 9px;font-size:13px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--card);color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:7px 11px;font:600 13px/1 inherit}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.stop{position:relative;padding:0 0 14px 18px;margin-left:5px;border-left:2px solid var(--line)}
.stop:last-child{border-left-color:transparent}
.stop::before{content:"";position:absolute;left:-7px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--card2);border:2px solid var(--muted)}
.stop.now::before{background:var(--accent);border-color:var(--accent)}
.stop.done{opacity:.55}
.time{font-weight:700;color:var(--accent2);font-size:13px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--card2);color:var(--muted);vertical-align:middle}
.badge.ok{color:var(--ok)}.badge.warn{color:var(--warn)}.badge.lock{color:var(--accent)}
.okc{color:var(--ok)}.warnc{color:var(--warn)}
.leg{font-size:14px;color:var(--muted);background:var(--card2);border-radius:12px;padding:8px 10px;margin:8px 0 0}
.leg ol{margin:4px 0 0;padding-left:20px}.leg li{margin:2px 0}
.big{font-size:30px;font-weight:800;letter-spacing:-.5px}
.jp{font-size:30px;line-height:1.45;font-weight:700;word-break:break-all}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin:6px 0 2px}.bar>i{display:block;height:100%;background:var(--ok)}
.bar.over>i{background:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}td:last-child{text-align:right}
#map{height:56vh;min-height:300px;border-radius:16px;z-index:1}
.leaflet-container{background:#1b2036}
.pin{background:var(--accent);color:#fff;border:2px solid #fff;border-radius:50%;width:26px!important;height:26px!important;display:flex;align-items:center;justify-content:center;font:700 12px/1 sans-serif;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.pin.unv{background:var(--warn);color:#222}
.me{background:#3b82f6;border:3px solid #fff;border-radius:50%;width:18px!important;height:18px!important;box-shadow:0 0 0 6px rgba(59,130,246,.25)}
.modal{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.hidden{display:none!important}
.sheet{background:var(--card);width:100%;max-width:720px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
label{display:block;font-size:13px;color:var(--muted);margin-top:4px}
input,select,textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:16px inherit;margin:4px 0 8px}
textarea{min-height:80px}
.check{display:flex;align-items:center;gap:8px;margin:6px 0 10px}.check input{width:auto;margin:0}
.tabs2{display:flex;gap:6px;margin-bottom:10px}
.hr{height:1px;background:var(--line);margin:10px 0}
.wx{display:flex;gap:14px;align-items:center}
.wx .t{font-size:28px;font-weight:800}
.list>div{padding:8px 0;border-bottom:1px solid var(--line)}.list>div:last-child{border:0}
.ask{z-index:2500;align-items:center}
.badge.wand{color:var(--accent2)}.badge.opt{color:var(--ok);border:1px solid var(--ok);background:none}
.stop.wander::before{background:var(--bg);border-style:dashed;border-color:var(--accent2)}.stop.wander h3{color:var(--accent2)}
.maplegend{display:flex;flex-wrap:wrap;gap:6px 14px}.maplegend span{display:inline-flex;align-items:center;gap:6px}
.maplegend i,.rseg i{display:inline-block;width:22px;height:5px;border-radius:3px;flex:none}.maplegend i.dash,.rseg i.dash{height:0;border-top:3px dashed;background:none}.maplegend i.dot{border-top-style:dotted}
.pin.mini{position:static;display:inline-flex!important;width:22px!important;height:22px!important;border-radius:50%;align-items:center;justify-content:center;font-size:11px;flex:none}
.stn{display:inline-block;width:10px;height:10px;border-radius:50%;background:#00b2e5;border:2px solid #fff}
.routelist{display:flex;flex-direction:column;gap:2px}.rstop{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.rleg{margin:0 0 4px 10px;padding:2px 0 6px 20px;border-left:2px dashed var(--line);display:flex;flex-direction:column;gap:3px}.rseg{display:flex;align-items:center;gap:8px;font-size:13px}
.seglabel span{display:inline-block;transform:translate(-50%,-50%);white-space:nowrap;background:rgba(15,18,32,.88);color:#fff;border:1.5px solid;border-radius:99px;padding:1px 6px;font:700 11px/1.4 -apple-system,system-ui,sans-serif}
.pin.skip{opacity:.4}
.pitem{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer}.pitem:last-child{border:0}.pitem input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--ok)}.pitem.on>span{color:var(--muted);text-decoration:line-through}.pitem .btn{margin-left:auto}
.tipchip{background:none;border:1px dashed var(--accent2);color:var(--accent2);border-radius:99px;padding:4px 9px;font:600 12px/1.2 inherit;cursor:pointer}
.upd{position:fixed;left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:1500;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--accent);border-radius:14px;padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.45)}
.seg{display:flex;gap:6px;margin:8px 0 4px}.seg button{flex:1;background:var(--bg);color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:7px 6px;font:600 13px/1.1 inherit}.seg button.on{background:var(--accent2);border-color:var(--accent2);color:#0f1220}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000;color:#fff;padding:10px 14px;border-radius:12px;z-index:3000;font-size:14px}
</style>
</head>
<body>
<header><h1 id="hTitle">Japan Trip</h1><div id="hSub" class="muted small"></div></header>
<main id="main"></main>
<nav id="nav">
  <button data-tab="today"><span class="i">☀️</span>Today</button>
  <button data-tab="days"><span class="i">🗓️</span>Days</button>
  <button data-tab="map"><span class="i">🗺️</span>Map</button>
  <button data-tab="money"><span class="i">💴</span>Money</button>
  <button data-tab="info"><span class="i">ℹ️</span>Info</button>
</nav>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<input type="file" id="fileIn" accept=".json,application/json,text/plain" hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
"use strict";
const APP_VERSION="2.0";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('Could not save on this device');return false}}};
const TZ='Asia/Tokyo';
let trip=LS.get('jt_trip',null), spend=LS.get('jt_spend',[]), rate=LS.get('jt_rate',null), myBudget=LS.get('jt_budget',null);
let packChk=LS.get('jt_pack',{}),packAdd=LS.get('jt_pack_add',{});
let tab=LS.get('jt_tab','today'), selDay=null, map=null, meMarker=null, watchId=null, clockTimer=null;
const saveTrip=()=>LS.set('jt_trip',trip), saveSpend=()=>LS.set('jt_spend',spend);
function toast(t){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function nowIn(tz){const f=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
  const p=Object.fromEntries(f.formatToParts(new Date()).map(x=>[x.type,x.value]));return{date:`${p.year}-${p.month}-${p.day}`,mins:(+p.hour%24)*60+ +p.minute}}
const toMin=t=>{if(!t||!/^\d{1,2}:\d{2}$/.test(String(t).trim()))return null;t=String(t).trim();const[h,m]=t.split(':').map(Number);return h*60+m};
const minRaw=m=>{m=Math.max(0,Math.round(m));return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const minTo=m=>{m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const t12=t=>{const m=toMin(t);if(m===null)return t||'';let h=Math.floor(m/60)%24;const ap=h>=12?'PM':'AM';h=h%12||12;return `${h}:${String(m%60).padStart(2,'0')} ${ap}`};
const dLabel=(d,o)=>new Date(d+'T12:00:00Z').toLocaleDateString('en-US',Object.assign({weekday:'short',month:'short',day:'numeric',timeZone:'UTC'},o||{}));
const dayDiff=(a,b)=>Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/864e5);
const usdPerJpy=()=>(rate&&rate.v)||(trip&&trip.fallbackUsdPerJpy)||0.0065;
const toUSD=(a,c)=>c==='USD'?+a:+a*usdPerJpy();
const usd=n=>(n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{maximumFractionDigits:0});
const yen=n=>'¥'+Math.round(n).toLocaleString('en-US');
const legMins=l=>l&&l.steps?l.steps.reduce((a,s)=>a+(+s.mins||0),0):0;
const legFare=l=>l&&l.steps?l.steps.reduce((a,s)=>a+(+s.fare||0),0):0;
const isOk=v=>v&&v.ok;
const today=()=>nowIn(TZ).date;
const dTZ=d=>d.tz||TZ;
/* which trip day is 'now' (each day can run on its own time zone, e.g. a Florida travel day) */
const addDays=(d,k)=>new Date(Date.parse(d+'T00:00:00Z')+k*864e5).toISOString().slice(0,10);
let curAdd=0; /* 1440 while a day's plan runs past midnight (e.g. an all-nighter) */
function curDay(){const D=trip.days;curAdd=0;for(let i=0;i<D.length;i++){const n=nowIn(dTZ(D[i]));
  const last=Math.max(0,...D[i].stops.map(s=>toMin(s.time)??0));
  if(last>=1440&&n.date===addDays(D[i].date,1)&&n.mins+1440<=last+30){curAdd=1440;return i}
  if(n.date!==D[i].date)continue;const nx=D[i+1];
  if(n.mins<=last+30||!nx||nowIn(dTZ(nx)).date!==nx.date)return i}return -1}
const uid=()=>Math.random().toString(36).slice(2,9);
function dirURL(s){const dest=(isOk(s.verified)&&s.lat&&!s.pinApprox)?`${s.lat},${s.lon}`:encodeURIComponent([s.name,s.address].filter(Boolean).join(', '));
  return `https://www.google.com/maps/dir/?api=1&destination=${dest}&travelmode=transit`}
function legURL(a,b,mode){const p=s=>(isOk(s.verified)&&s.lat&&!s.pinApprox)?`${s.lat},${s.lon}`:encodeURIComponent([s.name,s.address].filter(Boolean).join(', '));
  return `https://www.google.com/maps/dir/?api=1&origin=${p(a)}&destination=${p(b)}&travelmode=${mode==='walk'?'walking':'transit'}`}
function dist(a,b){if(!a||!b||a.lat==null||b.lat==null)return null;const R=6371,r=x=>x*Math.PI/180,dLa=r(b.lat-a.lat),dLo=r(b.lon-a.lon);
  const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
/* walking estimate: straight line x1.3 for streets, 4.8 km/h */
const walkMin=(a,b)=>{const k=dist(a,b);return k==null?null:Math.max(1,Math.round(k*1.3/4.8*60))};
const allWalkLeg=l=>!!(l&&l.steps&&l.steps.length&&l.steps.every(x=>x.mode==='walk'));
function legChoice(s,b){const l=s&&s.transitTo,t=legMins(l),w=b?walkMin(s,b):null,aw=allWalkLeg(l);
  const canWalk=!aw&&t>0&&w!=null&&w<=45;const rec=canWalk&&(w<=15||w<=t+5)?'walk':'transit';
  const mode=aw?'walk':(canWalk&&l.pick==='walk')?'walk':'transit';
  let mins=mode==='walk'&&!aw?w:t;if((!l||(!t&&!aw))&&w!=null)mins=w<=30?w:Math.round(12+dist(s,b)*2.2);
  return {t,w,aw,canWalk,rec,mode,mins}}
const routeKm=st=>{let d=0;for(let i=1;i<st.length;i++){const x=dist(st[i-1],st[i]);if(x!=null)d+=x}return d};
function vBadge(v){return isOk(v)?`<span class="badge ok">✅ Verified${v.src?' · '+esc(v.src):''}</span>`:`<span class="badge warn">⚠️ Check this</span>`}

/* ---------- render core ---------- */
function setTab(t){tab=t;LS.set('jt_tab',t);render();window.scrollTo(0,0)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  if(map){map.remove();map=null;meMarker=null}
  if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null}
  clearInterval(clockTimer);
  if(!trip||!Array.isArray(trip.days)){$('#hTitle').textContent='Japan Trip';$('#hSub').textContent='No trip loaded yet';$('#main').innerHTML=welcome();return}
  $('#hTitle').textContent=trip.name||'My Trip';
  const t=nowIn(dTZ(trip.days[0])).date,s=trip.days[0].date,e=trip.days[trip.days.length-1].date,i=curDay();
  $('#hSub').textContent=i>=0?`Day ${i+1} of ${trip.days.length} · ${trip.days[i].city||''}`:t<s?`${dayDiff(t,s)} days to go`:'Trip complete';
  if(selDay==null){selDay=i>=0?i:0}
  ({today:rToday,days:rDays,map:rMap,money:rMoney,info:rInfo}[tab]||rToday)();
}
function welcome(){return `<div class="card"><h2>Welcome 👋</h2>
  <p class="muted">This app holds no trip info on its own, so it's safe to keep public. Load your private trip file and it's saved only on this phone.</p>
  <button class="btn pri" onclick="pickFile()">📂 Import trip file</button></div>
  <div class="card muted small">Tip: in Safari, tap Share → <b>Add to Home Screen</b> to use this like an app. After it loads once, it works offline.</div>`}

/* ---------- stop + leg blocks ---------- */
function legHTML(s,b,di,si){const l=s&&s.transitTo,c=legChoice(s,b);
  if(!l){if(b&&c.w!=null&&c.w<=30)return `<div class="leg"><div class="between"><b>Getting to next stop</b><span class="small">🚶 ~${c.w} min walk (est.)</span></div><div style="margin-top:6px"><a class="small" href="${legURL(s,b,'walk')}" target="_blank" rel="noopener">Walking directions →</a></div></div>`;return ''}
  const a=s;
  const steps=(l.steps||[]).map(s=>`<li>${({walk:'🚶',train:'🚆',subway:'🚇',bus:'🚌',taxi:'🚕',ferry:'⛴️',ropeway:'🚡',plane:'✈️'}[s.mode]||'➡️')} ${esc(s.text)}${s.mins?` <span class="small">· ${s.mins} min</span>`:''}${s.fare?` <span class="small">· ~${yen(s.fare)}</span>`:''}</li>`).join('');
  const f=legFare(l),walking=c.mode==='walk'&&!c.aw;
  const sum=walking?`🚶 ~${c.w} min walk`:`${c.t?c.t+' min':''}${f?' · ~'+yen(f):''}`;
  const tog=c.canWalk&&di!=null?`<div class="seg"><button class="${!walking?'on':''}" onclick="setLeg(${di},${si},'transit')">🚆 Transit ${c.t}m${c.rec==='transit'?' ★':''}</button><button class="${walking?'on':''}" onclick="setLeg(${di},${si},'walk')">🚶 Walk ~${c.w}m${c.rec==='walk'?' ★':''}</button></div>`:'';
  const tip=c.canWalk&&c.rec==='walk'&&!walking?`<div class="small okc">★ Walking is about as fast${f?' and saves ~'+yen(f):''}. Tap Walk to switch.</div>`:'';
  return `<div class="leg"><div class="between"><b>Getting to next stop</b><span class="small">${sum}</span></div>${tog}${tip}
  ${walking?`<div class="small" style="margin-top:4px">Walking estimate from the map (~${(dist(s,b)*1.3).toFixed(1)} km). Check the route in Google Maps.</div>`:(steps?`<ol>${steps}</ol>`:'')}${l.note&&!walking?`<div class="small">${esc(l.note)}</div>`:''}${l.lastTrain?`<div class="small warnc">🌙 Last train: ${esc(l.lastTrain)}</div>`:''}
  ${b?`<div style="margin-top:6px"><a class="small" href="${legURL(s,b,walking||c.aw?'walk':'transit')}" target="_blank" rel="noopener">Live directions in Google Maps →</a></div>`:''}</div>`}
function setLeg(di,si,m){const s=trip.days[di].stops[si];if(!s.transitTo)return;s.transitTo.pick=m;saveTrip();render()}
function stopHTML(s,i,day,o){o=o||{};
  return `<div class="stop ${o.cls||''}${s.skipped?' done':''}${s.kind==='wander'?' wander':''}">${s.skipped?'<div class="small warnc">⏭️ Skipped</div>':''}<div class="between"><span class="time">${esc(t12(s.time))}${s.end?' – '+esc(t12(s.end)):''}</span>
  <span>${s.locked?'<span class="badge lock">🔒 Booked</span> ':''}${s.fixed?'<span class="badge lock">📌 Set time</span> ':''}${s.kind==='wander'?'<span class="badge wand">🚶 Wander</span> ':''}${s.optional?'<span class="badge opt">Optional</span> ':''}${s.kind==='wander'?'':vBadge(s.verified)}</span></div>
  <h3>${esc(s.name)}</h3>
  ${s.address?`<div class="muted small">📍 ${esc(s.address)}${s.pinApprox?' <span class="warnc">(map pin approximate)</span>':''}</div>`:''}
  ${s.hours?`<div class="muted small">🕘 ${esc(s.hours)}</div>`:''}
  ${s.price?`<div class="small">💴 ${esc(s.price)}</div>`:''}
  ${s.note?`<div class="small" style="margin-top:4px;white-space:pre-line">${esc(s.note)}</div>`:''}
  ${(s.tips||[]).length?`<div class="row" style="margin-top:6px">${s.tips.map(t=>{const x=tipById(t);return x?`<button class="tipchip" onclick="openTip('${esc(t)}')">💡 ${esc(x.title)}</button>`:''}).join('')}</div>`:''}
  <div class="row" style="margin-top:8px"><a class="btn sm" href="${dirURL(s)}" target="_blank" rel="noopener">🧭 Directions</a>

function wxCard(d){const w=d.wx||[35.68,139.76];return `<div class="card" id="wxCard" data-lat="${w[0]}" data-lon="${w[1]}" data-city="${esc(d.city||'')}"><div class="muted small">Weather · ${esc(d.city||'')}</div><div id="wxBody" class="muted small">Loading…</div></div>`}
async function loadWx(){const c=$('#wxCard');if(!c)return;const la=c.dataset.lat,lo=c.dataset.lon,key='jt_wx_'+la+'_'+lo;let data=LS.get(key,null);

    if(!r.ok)throw 0;data={t:Date.now(),j:await r.json()};LS.set(key,data)}}catch(e){if(!data){$('#wxBody').textContent='Weather unavailable offline';return}}

  if(d.planB&&d.planB.length)h+=`<div class="card"><h2>🌧️ Plan B</h2><ul class="small">${d.planB.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`;

function editStop(di,si,preName){const d=trip.days[di],s=si>=0?d.stops[si]:{time:'',name:preName||'',verified:{ok:false}};

  <div class="row"><div style="flex:1"><label>Start (24h, e.g. 14:30 · after midnight use 25:00+)</label><input id="fT" value="${esc(s.time)}" inputmode="numeric" placeholder="10:00"></div><div style="flex:1"><label>End (optional)</label><input id="fE" value="${esc(s.end||'')}" placeholder="11:00"></div></div>

  <label>Notes</label><textarea id="fNo">${esc(s.note||'')}</textarea>

  <div class="check"><input type="checkbox" id="fLk" ${s.locked?'checked':''}><label for="fLk" style="margin:0">🔒 Booked / fixed time (Optimize won't move it)</label></div>
  <div class="check"><input type="checkbox" id="fV" ${isOk(s.verified)?'checked':''}><label for="fV" style="margin:0">✅ I've double-checked this address/info</label></div>
  <div class="row" style="margin-top:6px"><button class="btn pri" onclick="saveStop(${di},${si})">Save</button>
  ${si>=0?`<button class="btn" onclick="moveStop(${di},${si},-1)">↑</button><button class="btn" onclick="moveStop(${di},${si},1)">↓</button><button class="btn" style="color:var(--accent)" onclick="delStop(${di},${si})">Delete</button>`:''}
  <button class="btn ghost" onclick="closeSheet()">Cancel</button></div>`)}
function saveStop(di,si){const d=trip.days[di],old=si>=0?d.stops[si]:{};const v=id=>$(id).value.trim();
  if(!v('#fN')){toast('Give it a name');return}
  if(v('#fT')&&toMin(v('#fT'))===null){toast('Time must look like 14:30');return}
  const steps=v('#fL').split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(p=>p.length>=2&&p.join('')).map(p=>({mode:p[0]||'walk',mins:+p[1]||0,fare:+p[2]||0,text:p.slice(3).join(' | ')||p[0]}));
  const addrChanged=v('#fA')!==(old.address||'');
  const s=Object.assign({},old,{time:v('#fT'),end:v('#fE'),name:v('#fN'),address:v('#fA'),price:v('#fP'),cost:+v('#fC')||0,note:v('#fNo'),locked:$('#fLk').checked});
  s.transitTo=steps.length?Object.assign({},old.transitTo||{},{steps}):(old.transitTo&&old.transitTo.lastTrain?{steps:[],lastTrain:old.transitTo.lastTrain}:null);
  s.verified=$('#fV').checked?(isOk(old.verified)&&!addrChanged?old.verified:{ok:true,src:'You',date:today()}):{ok:false};
  if(addrChanged&&old.lat!=null)s.pinApprox=true;
  if(si>=0)d.stops[si]=s;else{d.stops.push(s);d.stops.sort((a,b)=>(toMin(a.time)??9999)-(toMin(b.time)??9999))}
  saveTrip();closeSheet();render();toast('Saved')}
function moveStop(di,si,dir){const st=trip.days[di].stops,j=si+dir;if(j<0||j>=st.length)return;[st[si],st[j]]=[st[j],st[si]];const t=st[si].time;st[si].time=st[j].time;st[j].time=t;saveTrip();closeSheet();render()}
async function delStop(di,si){if(!await ask('Delete this stop?','Delete'))return;trip.days[di].stops.splice(si,1);saveTrip();closeSheet();render()}
const isAnchor=(s,i,st)=>s.locked||s.fixed||i===0||i===st.length-1||/^Home/.test(s.name||'');
async function optimize(di){const d=trip.days[di],msgs=[];let st=d.stops;
  if(st.length>=3){const times=st.map(s=>s.time),ends=st.map(s=>s.end),nextOf=new Map(st.map((s,i)=>[s,st[i+1]]));const out=[];let seg=[],anchor=null;
    const nn=(from,arr)=>{const res=[],pool=arr.slice();let c=from;while(pool.length){let bi=0,bd=Infinity;pool.forEach((p,j)=>{const x=c?dist(c,p):0;const dd=x==null?1e6:x;if(dd<bd){bd=dd;bi=j}});c=pool.splice(bi,1)[0];res.push(c)}return res};
    st.forEach((s,i)=>{if(isAnchor(s,i,st)){out.push(...nn(anchor,seg));seg=[];out.push(s);anchor=s}else seg.push(s)});out.push(...nn(anchor,seg));
    const before=routeKm(st),after=routeKm(out);
    if(after<before-0.3&&await ask(`Reorder stops to cut about ${(before-after).toFixed(1)} km of backtracking? Booked stops and home stay where they are. Moved stops lose their saved transit steps, so use Live directions for those.`,'Reorder')){
      out.forEach((s,i)=>{const dur=(toMin(s.end)!=null&&toMin(s.time)!=null)?toMin(s.end)-toMin(s.time):null;s.time=times[i];if(dur!=null)s.end=minRaw(toMin(s.time)+dur);
        if(nextOf.get(s)!==out[i+1]&&s.transitTo){s.transitTo={steps:[],note:'Order changed. Tap Live directions.',lastTrain:s.transitTo.lastTrain}}});
      d.stops=st=out;msgs.push(`Reordered (−${(before-after).toFixed(1)} km)`)}}
  let w=0;st.forEach((s,i)=>{const b=st[i+1];if(!b)return;const c=legChoice(s,b);if(c.canWalk&&c.rec==='walk'&&c.mode!=='walk'){s.transitTo.pick='walk';w++}});
  if(w)msgs.push(`${w} short hop${w>1?'s':''} switched to walking`);
  saveTrip();render();await checkTiming(di,msgs.length?msgs.join(' · ')+'. ':'Already efficient. ')}
async function checkTiming(di,pre){pre=pre||'';const st=trip.days[di].stops,shift=[],bad=[];let prevEnd=null;
  for(let i=0;i<st.length;i++){const s=st[i],t=toMin(s.time);if(t==null||s.skipped)continue;let start=t;
    if(i>0&&prevEnd!=null){const arr=prevEnd+(legChoice(st[i-1],s).mins||0);
      if(arr>t+2){if(s.locked||s.fixed)bad.push(`${s.locked?'🔒':'📌'} ${s.name}: you'd get there ~${t12(minTo(arr))}, but it's booked for ${t12(s.time)}.`);else{start=Math.ceil(arr/5)*5;shift.push({i,start,by:start-t})}}}
    const dur=(s.end&&toMin(s.end)!=null)?Math.max(0,toMin(s.end)-t):0;prevEnd=start+dur}
  if(!shift.length&&!bad.length){toast(pre+'Timing works ✓');return}
  const lines=[...bad,...shift.map(x=>`${st[x.i].name}: ${t12(st[x.i].time)} → ${t12(minTo(x.start))} (+${x.by} min)`)];
  if(!shift.length){await ask(pre+'Heads up:\n'+lines.join('\n')+'\nLeave earlier or cut time at the stop before.','OK',true);return}
  if(!await ask(pre+'Some stops start before you can get there:\n'+lines.join('\n')+'\nPush those stops later?','Push later'))return;
  shift.forEach(x=>{const s=st[x.i];if(s.end&&toMin(s.end)!=null)s.end=minRaw(toMin(s.end)+x.by);s.time=minRaw(x.start)});
  saveTrip();render();toast('Times updated')}

function delPackItem(id,t){packAdd[id]=(packAdd[id]||[]).filter(x=>x!==t);delete packChk[id+'|'+t];LS.set('jt_pack_add',packAdd);LS.set('jt_pack',packChk);render()}
async function resetPack(id){if(!await ask('Uncheck everything on this list?','Reset'))return;Object.keys(packChk).forEach(k=>{if(k.startsWith(id+'|'))delete packChk[k]});LS.set('jt_pack',packChk);render()}
function packDue(date){return (trip.packLists||[]).filter(l=>l.showFrom&&l.showUntil&&date>=l.showFrom&&date<=l.showUntil)}
function packCard(date){return packDue(date).map(l=>{const pr=packProg(l);return `<div class="card" onclick="tab='info';infoView='pack';openPack='${esc(l.id)}';LS.set('jt_tab','info');render()" style="cursor:pointer"><div class="between"><b>🧳 Packing: ${esc(l.title)}</b><span class="small ${pr.done===pr.total?'okc':'warnc'}">${pr.done}/${pr.total}</span></div><div class="bar ${pr.done===pr.total?'':'over'}"><i style="width:${pr.total?pr.done/pr.total*100:0}%"></i></div><div class="small muted">Tap to open the checklist</div></div>`}).join('')}

/* ---------- saved spots ---------- */
let spotLoc=null,spotMap=null;
const fmtKm=km=>km<1?Math.round(km*1000)+' m':(km<10?km.toFixed(1):Math.round(km))+' km';
function spotLocate(cb){if(!navigator.geolocation){toast('Location not available');return}
  navigator.geolocation.getCurrentPosition(p=>{spotLoc={lat:p.coords.latitude,lon:p.coords.longitude};if(cb)cb();else render()},
    ()=>toast('Allow location access to see distances'),{enableHighAccuracy:true,maximumAge:60000,timeout:15000})}
function spotDirURL(x){const dest=x.lat!=null?`${x.lat},${x.lon}`:encodeURIComponent([x.name,x.address].filter(Boolean).join(', '));
  return `https://www.google.com/maps/dir/?api=1${spotLoc?`&origin=${spotLoc.lat},${spotLoc.lon}`:''}&destination=${dest}&travelmode=transit`}
function closeSpot(){if(spotMap){spotMap.remove();spotMap=null}const m=document.getElementById('spotModal');if(m)m.remove()}
function spotDistText(x){if(!spotLoc)return 'Finding you…';const km=dist(spotLoc,x);if(km==null)return '';
  return `📍 ${fmtKm(km)} from you`+(km<=3?` · ~${walkMin(spotLoc,x)} min walk`:km>100?' · that\'s in another city':km>40?' · a day trip from here':' · take the train')}
function openSpot(i){const x=(trip.spots||[])[i];if(!x)return;closeSpot();
  const m=document.createElement('div');m.className='modal';m.id='spotModal';m.onclick=e=>{if(e.target===m)closeSpot()};
  m.innerHTML=`<div class="sheet"><div class="between"><h2 style="margin:0">${esc(x.icon||'📍')} ${esc(x.name)}</h2><button class="btn sm ghost" onclick="closeSpot()">✕</button></div>
    <div class="small muted" style="margin:4px 0 8px">${esc([x.when,x.hours].filter(Boolean).join(' · '))}</div>
    <div id="spotmap" style="height:260px;border-radius:12px;overflow:hidden;background:var(--card2)"></div>
    <div id="spotDist" class="small" style="margin:8px 0">${esc(spotDistText(x))}</div>
    ${x.note?`<div class="small" style="white-space:pre-line;margin-bottom:8px">${esc(x.note)}</div>`:''}
    ${x.address?`<div class="small muted" style="margin-bottom:10px">${esc(x.address)}</div>`:''}
    <div class="row"><a class="btn pri" id="spotDir" href="${spotDirURL(x)}" target="_blank" rel="noopener" style="flex:1;justify-content:center">🧭 Directions</a>
    <a class="btn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([x.name,x.address].filter(Boolean).join(', '))}" target="_blank" rel="noopener">Google Maps</a></div></div>`;
  document.body.appendChild(m);
  const draw=()=>{if(!window.L||x.lat==null){const el=$('#spotmap');if(el)el.innerHTML='<div class="muted small" style="padding:12px">Map needs a connection. Directions still work.</div>';return}
    if(!spotMap){spotMap=L.map('spotmap',{zoomControl:false,attributionControl:false}).setView([x.lat,x.lon],15);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(spotMap);
      L.marker([x.lat,x.lon],{icon:L.divIcon({className:'pin',html:'★',iconSize:[26,26]})}).addTo(spotMap)}
    if(spotLoc){L.marker([spotLoc.lat,spotLoc.lon],{icon:L.divIcon({className:'me',iconSize:[18,18]})}).addTo(spotMap);
      const km=dist(spotLoc,x);if(km!=null&&km<60){spotMap.fitBounds([[x.lat,x.lon],[spotLoc.lat,spotLoc.lon]],{padding:[30,30],maxZoom:16});
        L.polyline([[x.lat,x.lon],[spotLoc.lat,spotLoc.lon]],{color:'#cfd3e6',weight:3,dashArray:'2 7'}).addTo(spotMap)}}
    setTimeout(()=>spotMap&&spotMap.invalidateSize(),60)};
  setTimeout(draw,30);
  spotLocate(()=>{const d=$('#spotDist');if(d)d.textContent=spotDistText(x);const a=$('#spotDir');if(a)a.href=spotDirURL(x);if(spotMap)draw()})}

/* ---------- MAP ---------- */
const MODE={walk:{c:'#cfd3e6',dash:'2 7',w:4,i:'🚶',n:'Walk'},train:{c:'#5fd4e6',w:6,i:'🚆',n:'Train'},subway:{c:'#5fd4e6',w:6,i:'🚇',n:'Subway'},bus:{c:'#b07cff',dash:'10 6',w:5,i:'🚌',n:'Bus'},taxi:{c:'#ffb347',dash:'1 8',w:5,i:'🚗',n:'Car / taxi'},plane:{c:'#ffffff',dash:'6 10',w:2,i:'✈️',n:'Flight'},ferry:{c:'#4fb3ff',dash:'8 8',w:4,i:'⛴️',n:'Boat'},ropeway:{c:'#ff8ad8',dash:'4 4',w:4,i:'🚡',n:'Ropeway'}};
const isJapanDay=d=>!d.tz||d.tz===TZ;
function legSegments(s,b){const l=s.transitTo,c=legChoice(s,b),out=[];if(!b||s.lat==null||b.lat==null)return out;
  const A=[s.lat,s.lon],B=[b.lat,b.lon];
  if(!l||!l.steps||!l.steps.length||(c.mode==='walk'&&!c.aw)){out.push({a:A,b:B,mode:l&&l.steps&&l.steps.length&&c.mode!=='walk'?'train':'walk',mins:c.mins,text:c.mode==='walk'?`Walk ~${c.w} min`:'Getting there',est:!l||!l.steps||!l.steps.length});return out}
  let cur=A,pend=[];l.steps.forEach((st,k)=>{pend.push(st);const last=k===l.steps.length-1;const end=st.to?st.to:(last?B:null);if(!end)return;
    const main=pend.find(x=>x.mode!=='walk')||pend[pend.length-1];const mins=pend.reduce((t,x)=>t+(+x.mins||0),0);
    if(Math.abs(cur[0]-end[0])>1e-5||Math.abs(cur[1]-end[1])>1e-5)out.push({a:cur,b:end,mode:main.mode,color:main.color,line:main.line,mins,text:pend.map(x=>x.text).join(' → ')});
    cur=end;pend=[]});
  if(Math.abs(cur[0]-B[0])>1e-5||Math.abs(cur[1]-B[1])>1e-5)out.push({a:cur,b:B,mode:'walk',mins:0,text:'Walk to the stop'});
  return out}
let mapLegendOpen=LS.get('jt_legend',true);
function rMap(){const D=trip.days,all=selDay===-1;
  if(!all&&!D[selDay])selDay=0;const d=all?null:D[selDay];
  let h=dayChips(true)+`<div id="map"></div>`;
  h+=`<div class="row" style="margin-top:10px"><button class="btn sm" onclick="locate()">📍 Where am I</button><button class="btn sm" onclick="mapLegendOpen=!mapLegendOpen;LS.set('jt_legend',mapLegendOpen);render()">${mapLegendOpen?'Hide':'Show'} key</button></div>`;
  if(mapLegendOpen)h+=`<div class="card small" style="margin-top:10px"><div class="maplegend">
    <span><i style="background:#00b2e5"></i>Train / subway (line color)</span><span><i class="dash" style="border-color:#cfd3e6"></i>Walk</span>
    <span><i class="dash dot" style="border-color:#ffb347"></i>Car / taxi</span><span><i class="dash" style="border-color:#b07cff"></i>Bus</span>
    <span><i class="dash" style="border-color:#fff"></i>Flight</span><span><b class="pin mini">1</b>Stop (order)</span><span><b class="pin mini unv">2</b>Pin needs checking</span><span><b class="stn"></b>Station / transfer</span></div>
    <div class="muted" style="margin-top:6px">Lines go stop → station → transfer → station → stop. They show the order of your route, not the exact track. Tap a line for the step, or tap a stop below to fly to it.</div></div>`;
  if(d){h+=`<div class="card"><h2>Route · ${dLabel(d.date)}</h2><div class="routelist">`;
    d.stops.forEach((s,i)=>{const b=d.stops[i+1];const segs=legSegments(s,b);const c=b?legChoice(s,b):null;
      h+=`<div class="rstop" onclick="flyStop(${i})"><span class="pin mini ${isOk(s.verified)&&!s.pinApprox?'':'unv'}">${i+1}</span><div style="min-width:0"><div class="time">${esc(t12(s.time))}</div><b>${esc(s.name)}</b></div></div>`;
      if(b&&segs.length){h+=`<div class="rleg">${segs.filter(g=>g.mins||segs.length===1).map(g=>{const m=MODE[g.mode]||MODE.train;return `<div class="rseg"><i style="background:${g.mode==='walk'||g.mode==='taxi'||g.mode==='plane'?'none':(g.color||m.c)};border-color:${g.color||m.c}" class="${g.mode==='walk'||g.mode==='taxi'||g.mode==='plane'?'dash':''}"></i><span>${m.i} ${esc(g.line||m.n)}${g.mins?` · ${g.mins} min`:''}${g.est?' (est.)':''}</span></div>`}).join('')}
        <div class="small muted">${c&&c.mins?`Total ~${c.mins} min`:''}${c&&c.mode!=='walk'&&legFare(s.transitTo)?` · ~${yen(legFare(s.transitTo))}`:''}</div></div>`}});
    h+=`</div></div>`}
  $('#main').innerHTML=h;
  if(!window.L){$('#map').innerHTML='<div class="card muted">The map needs a connection the first time it loads.</div>';return}
  map=L.map('map',{zoomControl:false,tap:true}).setView([35.68,139.76],11);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  const pts=[];const colors=['#ff4d6d','#5fd4e6','#ffb347','#3ddc97','#c084fc'];window._stopMarkers=[];
  const days=all?D.map((x,i)=>i).filter(i=>isJapanDay(D[i])):[selDay];
  days.forEach((di,k)=>{const dd=D[di];let n=0;
    if(all){const ll=dd.stops.filter(s=>s.lat!=null).map(s=>[s.lat,s.lon]);if(ll.length>1)L.polyline(ll,{color:colors[k%colors.length],weight:3,opacity:.75,dashArray:'4 6'}).addTo(map)}
    else dd.stops.forEach((s,i)=>{legSegments(s,dd.stops[i+1]).forEach(g=>{const m=MODE[g.mode]||MODE.train;const col=g.color||m.c;
      const line=L.polyline([g.a,g.b],{color:col,weight:m.w,opacity:.95,dashArray:m.dash||null,lineCap:'round'}).addTo(map);
      if(!m.dash)L.polyline([g.a,g.b],{color:'#0f1220',weight:m.w+4,opacity:.55}).addTo(map).bringToBack();
      line.bindPopup(`<b>${m.i} ${esc(g.line||m.n)}</b>${g.mins?` · ${g.mins} min`:''}<br><span style="font-size:12px">${esc(g.text||'')}</span>`);
      if(g.mode!=='plane'&&(g.mode!=='walk'||g.mins>=10)&&g.mins>=4&&(dist({lat:g.a[0],lon:g.a[1]},{lat:g.b[0],lon:g.b[1]})||0)>0.35){const mid=[(g.a[0]+g.b[0])/2,(g.a[1]+g.b[1])/2];L.marker(mid,{interactive:false,icon:L.divIcon({className:'seglabel',html:`<span style="border-color:${col}">${m.i} ${g.mins}m</span>`,iconSize:null})}).addTo(map)}
      if(g.mode!=='walk'&&g.b){L.circleMarker(g.b,{radius:5,color:'#fff',weight:2,fillColor:col,fillOpacity:1}).addTo(map)}
      pts.push(g.a,g.b)})});
    dd.stops.forEach((s,i)=>{if(s.lat==null)return;n++;const p=[s.lat,s.lon];pts.push(p);
      const m=L.marker(p,{zIndexOffset:500,icon:L.divIcon({className:'pin'+(isOk(s.verified)&&!s.pinApprox?'':' unv')+(s.skipped?' skip':''),html:all?String(di+1):String(i+1),iconSize:[26,26]})}).addTo(map);
      m.bindPopup(`<b>${esc(s.name)}</b><br>${esc(t12(s.time))}${all?' · '+dLabel(dd.date):''}<br><a href="${dirURL(s)}" target="_blank" rel="noopener">Directions →</a>`);
      if(!all)window._stopMarkers[i]=m})});
  if(pts.length)map.fitBounds(pts,{padding:[30,30],maxZoom:15});setTimeout(()=>map&&map.invalidateSize(),80)}
function flyStop(i){const m=window._stopMarkers&&window._stopMarkers[i];if(!m||!map)return;map.flyTo(m.getLatLng(),16,{duration:.6});m.openPopup();window.scrollTo({top:0,behavior:'smooth'})}
function locate(){if(!navigator.geolocation){toast('Location not available');return}
  watchId=navigator.geolocation.watchPosition(p=>{const ll=[p.coords.latitude,p.coords.longitude];if(!map)return;
    if(!meMarker){meMarker=L.marker(ll,{icon:L.divIcon({className:'me',iconSize:[18,18]})}).addTo(map);map.setView(ll,15)}else meMarker.setLatLng(ll)},
    ()=>toast('Allow location access to see yourself'),{enableHighAccuracy:true,maximumAge:15000})}

/* ---------- MONEY ---------- */
let moneyView='budget';
const bud=()=>myBudget||trip.budget||{categories:[]};
const budPrepaid=B=>(B.prepaid||[]).reduce((a,x)=>a+(+x.usd||0),0);
const budAvail=B=>B.total!=null&&B.total!==''?(+B.total||0)-budPrepaid(B):(+B.remaining||0);
const catUsed=c=>(+c.committed||0)+spentUSD(x=>x.cat===c.name);
function daysLeftInTrip(){const D=(trip.days||[]).filter(isJapanDay);if(!D.length)return 0;const t=today(),f=D[0].date,l=D[D.length-1].date;
  const from=t<f?f:t;if(from>l)return 0;return Math.round((new Date(l)-new Date(from))/864e5)+1}
function saveBudget(B){myBudget=B;LS.set('jt_budget',B)}
async function resetBudget(){if(!await ask("Go back to the budget from the trip file? Your purchases stay.",'Reset'))return;myBudget=null;LS.set('jt_budget',null);render();toast('Budget reset')}
function bRow(kind,x){return kind==='pre'
  ?`<div class="row brow" data-kind="pre" style="margin-bottom:6px"><input class="bn" value="${esc(x.name||'')}" placeholder="Flights" style="flex:2;margin:0"><input class="bu" inputmode="decimal" value="${esc(x.usd??'')}" placeholder="$" style="flex:1;margin:0"><button class="btn sm ghost" onclick="this.parentNode.remove();budTotals()">✕</button></div>`
  :`<div class="brow" data-kind="cat" data-old="${esc(x.name||'')}" style="margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)"><div class="row"><input class="bn" value="${esc(x.name||'')}" placeholder="Category" style="flex:2;margin:0"><button class="btn sm ghost" onclick="this.closest('.brow').remove();budTotals()">✕</button></div>
    <div class="row" style="margin-top:6px"><div style="flex:1"><label>Limit $</label><input class="ba" inputmode="decimal" value="${esc(x.amount??'')}" oninput="budTotals()" style="margin:0"></div><div style="flex:1"><label>Already booked $</label><input class="bc" inputmode="decimal" value="${esc(x.committed??'')}" style="margin:0"></div></div>
    <input class="bnote" type="hidden" value="${esc(x.note||'')}"></div>`}
function editBudget(){const B=JSON.parse(JSON.stringify(bud()));
  if(B.total==null){B.total=Math.round((+B.remaining||0)+budPrepaid(B))}
  openSheet(`<h2>✏️ Edit budget</h2><div class="small muted">Raise the total any time. Category limits are what keep you from splurging by accident.</div>
  <div class="row" style="margin-top:8px"><div style="flex:1"><label>Total trip budget $</label><input id="bT" inputmode="decimal" value="${esc(B.total)}" oninput="budTotals()"></div><div style="flex:1"><label>Daily food target $</label><input id="bF" inputmode="decimal" value="${esc(B.dailyFood??'')}"></div></div>
  <h3 style="margin:10px 0 6px">Already paid (before the trip)</h3><div id="bPre">${(B.prepaid||[]).map(x=>bRow('pre',x)).join('')}</div>
  <button class="btn sm" onclick="$('#bPre').insertAdjacentHTML('beforeend',bRow('pre',{}))">＋ Add prepaid item</button>
  <h3 style="margin:14px 0 6px">Categories (spending limits)</h3><div id="bCats">${B.categories.map(c=>bRow('cat',c)).join('')}</div>
  <button class="btn sm" onclick="$('#bCats').insertAdjacentHTML('beforeend',bRow('cat',{}))">＋ Add category</button>
  <div id="bSum" class="card small" style="margin-top:12px"></div>
  <div class="row"><button class="btn pri" onclick="saveBudgetForm()">Save budget</button><button class="btn ghost" onclick="closeSheet()">Cancel</button></div>`);
  $('#bPre').addEventListener('input',budTotals);budTotals()}
function readBudgetForm(){const pre=[...document.querySelectorAll('#bPre .brow')].map(r=>({name:r.querySelector('.bn').value.trim(),usd:parseFloat(r.querySelector('.bu').value)||0})).filter(x=>x.name||x.usd);
  const cats=[...document.querySelectorAll('#bCats .brow')].map(r=>({old:r.dataset.old,name:r.querySelector('.bn').value.trim(),amount:parseFloat(r.querySelector('.ba').value)||0,committed:parseFloat(r.querySelector('.bc').value)||0,note:r.querySelector('.bnote').value})).filter(c=>c.name);
  return {total:parseFloat($('#bT').value)||0,dailyFood:parseFloat($('#bF').value)||0,prepaid:pre,categories:cats}}
function budTotals(){const f=readBudgetForm(),pp=f.prepaid.reduce((a,x)=>a+x.usd,0),av=f.total-pp,as=f.categories.reduce((a,c)=>a+c.amount,0),un=av-as;
  const el=$('#bSum');if(el)el.innerHTML=`<div class="between"><span>Total</span><b>${usd(f.total)}</b></div><div class="between"><span>− Already paid</span><b>${usd(pp)}</b></div><div class="between"><span>= Money to spend</span><b>${usd(av)}</b></div><div class="between"><span>Assigned to categories</span><b>${usd(as)}</b></div><div class="between"><span>Not assigned (buffer)</span><b class="${un<0?'warnc':'okc'}">${usd(un)}</b></div>${un<0?'<div class="warnc" style="margin-top:4px">Limits add up to more than you have.</div>':''}`}
function saveBudgetForm(){const f=readBudgetForm();if(!f.categories.length){toast('Keep at least one category');return}
  const names=new Set();for(const c of f.categories){if(names.has(c.name)){toast('Two categories have the same name');return}names.add(c.name)}
  f.categories.forEach(c=>{if(c.old&&c.old!==c.name)spend.forEach(x=>{if(x.cat===c.old)x.cat=c.name})});saveSpend();
  f.categories=f.categories.map(({old,...c})=>{if(!c.committed)delete c.committed;if(!c.note)delete c.note;return c});
  saveBudget(f);closeSheet();render();toast('Budget saved')}
function spendHint(){const k=$('#sK'),a=$('#sA'),c=$('#sC'),el=$('#sHint');if(!k||!el)return;const cat=bud().categories.find(x=>x.name===k.value);if(!cat){el.innerHTML='';return}
  const amt=parseFloat(a.value)||0,add=amt?toUSD(amt,c.value):0,lim=+cat.amount||0,used=catUsed(cat)-(window._editAmt||0),after=lim-used-add;
  el.innerHTML=`<span class="${after<0?'warnc':after<lim*0.2?'warnc':'muted'}">${esc(cat.name)}: ${usd(lim-used)} left${amt?` → <b>${after>=0?usd(after)+' left after this':usd(-after)+' OVER after this'}</b>`:''}</span>`}
function spentUSD(f){return spend.filter(f||(()=>1)).reduce((a,x)=>a+toUSD(x.amount,x.cur),0)}
function rMoney(){const b=trip.budget||{categories:[]},t=today();let h=`<div class="tabs2">${['budget','log','haul'].map(v=>`<button class="chip ${moneyView===v?'on':''}" onclick="moneyView='${v}';render()">${{budget:'Budget',log:'Spending',haul:'Haul & tax-free'}[v]}</button>`).join('')}</div>`;
  h+=`<button class="btn pri" style="width:100%;justify-content:center;margin-bottom:12px" onclick="addSpend()">＋ Log a purchase</button>`;
  if(moneyView==='budget'){const B=bud(),av=budAvail(B),t=today();
    const committed=B.categories.reduce((a,c)=>a+(+c.committed||0),0),sp=spentUSD(),left=av-committed-sp,todaySp=spentUSD(x=>x.date===t),daily=+B.dailyFood||0;
    const assigned=B.categories.reduce((a,c)=>a+(+c.amount||0),0),unas=av-assigned;
    h+=`<div class="card"><div class="between"><div class="muted small">Trip money left</div><button class="btn sm" onclick="editBudget()">✏️ Edit budget</button></div><div class="big ${left<0?'warnc':''}">${usd(left)}</div>
      <div class="muted small">${B.total?`${usd(B.total)} total − ${usd(budPrepaid(B))} prepaid = ${usd(av)} to spend`:`${usd(av)} to spend`} · ${usd(committed)} booked · ${usd(sp)} logged</div></div>`;
    const food=B.categories.find(c=>/food/i.test(c.name));let pace='';
    if(food){const fl=(+food.amount||0)-(+food.committed||0)-spentUSD(x=>x.cat===food.name),dl=daysLeftInTrip();if(dl>0)pace=`<div class="small" style="margin-top:6px">🍜 Food money left: <b>${usd(fl)}</b> for ${dl} day${dl>1?'s':''} = <b class="${fl/dl<daily*0.8?'warnc':'okc'}">${usd(fl/dl)}/day</b></div>`}
    h+=`<div class="card"><div class="between"><div><div class="muted small">Spent today</div><div style="font-size:22px;font-weight:700">${usd(todaySp)}</div></div><div style="text-align:right"><div class="muted small">Daily food target</div><div style="font-size:22px;font-weight:700">${usd(daily)}</div></div></div>
    <div class="bar ${todaySp>daily?'over':''}"><i style="width:${Math.min(100,daily?todaySp/daily*100:0)}%"></i></div>${pace}</div>`;
    h+=`<div class="card"><h2>By category</h2><div class="small muted" style="margin-bottom:8px">Each category is a limit. Log purchases to the right one and you'll see when one gets close.</div>${B.categories.map(c=>{const used=catUsed(c),lim=+c.amount||0,pct=lim?used/lim*100:0,rem=lim-used;

function unverified(){const out=[],seen=new Map();
  trip.days.forEach((d,di)=>d.stops.forEach((s,si)=>{if(!isOk(s.verified)||s.pinApprox){const key=(s.name+'|'+(s.address||'')).toLowerCase();
    if(seen.has(key)){const u=seen.get(key);u.refs.push({t:'stop',di,si});u.n++;u.sub=u.base+` · ${u.n} days`;return}
    const base=`${s.address||'no address yet'}${s.pinApprox&&isOk(s.verified)?' · address OK, map pin approximate':''}`;
    const u={label:s.name,base,sub:`${dLabel(d.date)} · ${base}`,n:1,url:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent([s.name,s.address].filter(Boolean).join(', ')),refs:[{t:'stop',di,si}]};
    seen.set(key,u);out.push(u)}}));
  (trip.stays||[]).forEach((s,i)=>{if(!isOk(s.verified))out.unshift({label:'🛏️ '+s.name,sub:'Stay · '+s.address+(s.note?' · '+s.note:''),url:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.name+', '+s.address),refs:[{t:'stay',i}]})});
  (trip.taxiCards||[]).forEach((c,i)=>{if(!isOk(c.verified))out.unshift({label:'🚕 Taxi card: '+c.name,sub:c.checkNote||c.en,url:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(c.en),refs:[{t:'taxi',i}]})});
  return out}
function markChecked(k){const u=unverified()[k];if(!u)return;const v={ok:true,src:'You',date:today()};
  u.refs.forEach(r=>{if(r.t==='stop'){const s=trip.days[r.di].stops[r.si];s.verified=v;s.pinApprox=false}else if(r.t==='stay')trip.stays[r.i].verified=v;else trip.taxiCards[r.i].verified=v});
  saveTrip();render();toast('Marked checked')}
function showTaxi(i){const c=trip.taxiCards[i];openSheet(`<div style="padding:10px 4px"><div class="muted small">${esc(c.name)}</div><div class="jp" style="margin:10px 0">${esc(c.ja||c.en)}</div>${c.ja?`<div class="muted">${esc(c.en)}</div>`:''}<div class="hr"></div><div style="font-size:22px;font-weight:700">${esc(trip.taxiLine||'この住所までお願いします。')}</div><div class="muted small">“Please take me to this address.”</div>${c.tel?`<div style="margin-top:10px">📞 ${esc(c.tel)}</div>`:''}<button class="btn" style="margin-top:14px" onclick="closeSheet()">Close</button></div>`)}

function ask(msg,yes,only){return new Promise(res=>{const d=document.createElement('div');d.className='modal ask';
  d.innerHTML=`<div class="sheet" style="max-width:420px;border-radius:20px;margin:0 16px calc(24px + env(safe-area-inset-bottom))"><p style="margin:4px 0 14px;white-space:pre-line">${esc(msg)}</p><div class="row" style="justify-content:flex-end">${only?'':'<button class="btn ghost" data-v="0">Cancel</button>'}<button class="btn pri" data-v="1">${esc(yes||'OK')}</button></div></div>`;
  d.onclick=e=>{const b=e.target.closest('button');if(!b&&e.target!==d)return;d.remove();res(!!(b&&b.dataset.v==='1'))};document.body.appendChild(d)})}

    selDay=null;render();toast('Trip loaded ✓')}catch(err){ask('Could not read that file: '+err.message,'OK',true)}});
async function exportTrip(){const data=JSON.stringify(Object.assign({},trip,{_spending:spend,_budget:myBudget||undefined,exported:new Date().toISOString()}),null,2);
  const name=`japan-trip-${today()}.json`,file=new File([data],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
async function resetAll(){if(!await ask('Erase the trip and spending log from this phone? Export first if you want a backup.','Erase'))return;['jt_trip','jt_spend'].forEach(k=>localStorage.removeItem(k));trip=null;spend=[];render()}

if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
/* ---------- app update check ---------- */
async function checkUpdate(){try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const j=await r.json();if(j&&j.v&&j.v!==APP_VERSION)showUpdate(j)}catch(e){}}
function showUpdate(j){if($('#upd'))return;const d=document.createElement('div');d.id='upd';d.className='upd';
  d.innerHTML=`<div style="min-width:0"><b>App update ready (v${esc(j.v)})</b><div class="small muted">${esc(j.note||'Tap Reload. Your trip and spending stay put.')}</div></div><button class="btn pri sm" onclick="doUpdate()">Reload</button>`;document.body.appendChild(d)}
async function doUpdate(){const b=$('#upd button');if(b)b.textContent='Updating…';
  try{if(navigator.serviceWorker){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs)await r.update().catch(()=>{})}
    const ks=await caches.keys();await Promise.all(ks.filter(k=>k.startsWith('jt-shell')).map(k=>caches.delete(k)))}catch(e){}
  location.reload()}
window.addEventListener('load',()=>setTimeout(checkUpdate,1200));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});
render();
</script>
